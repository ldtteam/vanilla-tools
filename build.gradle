plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.115' // keep 2.x current
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

/* === MDG 2.x REQUIRED BLOCKS === */
neoForge {
    // 1) Tell MDG which NeoForge/Minecraft to use
    //    (use your gradle.properties value, or hardcode to test)
    version = neo_version
    // version = "21.8.46"   // quick sanity test: hardcode once

    // 2) Declare your mod's source set
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // 3) Define runs; use the helpers so MDG knows the type
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        client { client() }             // <-- generates task: runClient
        server { server(); programArgument '--nogui' }
        gameTestServer { type = "gameTestServer" }

        clientData {
            clientData()  // mark as data generator
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

/* If you still have this line, remove it (MDG manages the platform):
   dependencies { implementation "net.neoforged:neoforge:${neo_version}" }
*/

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    def replace = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replace
    filesMatching('META-INF/neoforge.mods.toml') { expand replace }
}
